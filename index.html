<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paikallinen AI Video Editor</title>
    <!-- Aktivoidaan monisäikeisyys-korjaus GitHub Pagesille -->
    <script src="coi-serviceworker.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 30px auto; padding: 20px; background: #0f172a; color: #f8fafc; }
        .editor-box { background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; }
        h1 { margin-top: 0; color: #38bdf8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        video { width: 100%; border-radius: 8px; background: #000; max-height: 250px; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        button:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
        .status-log { background: #020617; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; color: #34d399; height: 100px; overflow-y: auto; border: 1px solid #334155; margin: 15px 0; }
        .segment { background: #334155; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .cut-btn { background: #ef4444; width: auto; padding: 6px 12px; font-size: 12px; }
    </style>
</head>
<body>

<div class="editor-box">
    <h1>🎬 Paikallinen AI Video Editor (GitHub)</h1>
    <p>Kaikki tekoäly ja videomuokkaus tapahtuu 100% ilmaiseksi selaimesi sisällä.</p>

    <input type="file" id="video-input" accept="video/*">
    <div class="status-log" id="log-box">> Odotetaan videota...</div>

    <div class="grid">
        <div>
            <h3>Alkuperäinen Video</h3>
            <video id="video-preview" controls></video>
            <button id="ai-btn" disabled style="margin-top:15px;">✨ Aja AI-puheentunnistus</button>
        </div>
        <div>
            <h3>Leikattu Lopputulos</h3>
            <video id="video-output" controls></video>
            <a id="download-link" style="display:none;"><button style="background:#22c55e; margin-top:15px;">📥 Lataa valmis video</button></a>
        </div>
    </div>

    <h3 style="margin-top: 30px; color: #38bdf8;">Tekoälyn löytämät lauseet</h3>
    <div id="segments-container">Lataa video ja aja tekoäly nähdäksesi puheen aikaleimat...</div>
</div>

<script type="module">
    import { pipeline } from 'https://jsdelivr.net';
    import { createFFmpeg, fetchFile } from 'https://jsdelivr.net';

    const videoInput = document.getElementById('video-input');
    const videoPreview = document.getElementById('video-preview');
    const videoOutput = document.getElementById('video-output');
    const aiBtn = document.getElementById('ai-btn');
    const logBox = document.getElementById('log-box');
    const segmentsContainer = document.getElementById('segments-container');
    const downloadLink = document.getElementById('download-link');

    let videoFile = null;
    const ffmpeg = createFFmpeg({ log: false });

    async function alustaFFmpeg() {
        log("Ladataan FFmpeg-videomoottoria...");
        await ffmpeg.load();
        log("Videomoottori valmis!");
    }
    alustaFFmpeg();

    function log(msg) {
        logBox.innerHTML += `<br>> ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    videoInput.addEventListener('change', (e) => {
        videoFile = e.target.files[0];
        if (videoFile) {
            videoPreview.src = URL.createObjectURL(videoFile);
            aiBtn.disabled = false;
            log(`Video '${videoFile.name}' ladattu.`);
        }
    });

    // Äänen aito purkaminen videosta Whisper-tekoälylle sopivaksi (16kHz AudioBuffer)
    async function puraAani(file) {
        log("Puretaan ääniraitaa videosta tekoälyä varten...");
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const fileReader = new FileReader();
        
        return new Promise((resolve) => {
            fileReader.onload = async (event) => {
                const arrayBuffer = event.target.result;
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                resolve(audioBuffer.getChannelData(0)); // Palautetaan mono-ääniraita flattina arrayna
            };
            fileReader.readAsArrayBuffer(file);
        });
    }

    aiBtn.addEventListener('click', async () => {
        if (!videoFile) return;
        aiBtn.disabled = true;
        
        try {
            const pureskeltuAani = await puraAani(videoFile);
            
            log("Ladataan Whisper AI-mallia selaimeen (n. 75MB)...");
            // Huom: "Xenova/whisper-tiny" tukee myös suomea automaattisesti
            const transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny');
            
            log("Tekoäly analysoi puhetta (tämä voi kestää hetken videon pituudesta riippuen)...");
            const tulos = await transcriber(pureskeltuAani, { chunk_length_s: 30, stride_length_s: 5 });
            
            log("AI-analyysi valmis!");
            naytaSegmentit(tulos.chunks || [{ start: 0, end: 5, text: tulos.text }]);
        } catch (err) {
            log("Virhe: " + err.message);
            aiBtn.disabled = false;
        }
    });

    function naytaSegmentit(chunks) {
        segmentsContainer.innerHTML = "";
        if (!chunks || chunks.length === 0) {
            segmentsContainer.innerHTML = "Puhetta ei tunnistettu.";
            return;
        }
        chunks.forEach(chunk => {
            const start = chunk.timestamp[0] || 0;
            const end = chunk.timestamp[1] || start + 2;
            const div = document.createElement('div');
            div.className = 'segment';
            div.innerHTML = `
                <span>⏱️ <b>${start}s - ${end}s</b>: "${chunk.text}"</span>
                <button class="cut-btn" onclick="window.leikkaaVideo(${start}, ${end})">Leikkaa</button>
            `;
            segmentsContainer.appendChild(div);
        });
    }

    window.leikkaaVideo = async function(start, end) {
        log(`Leikataan: ${start}s -> ${end}s...`);
        ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(videoFile));
        await ffmpeg.run('-ss', start.toString(), '-i', 'input.mp4', '-t', (end - start).toString(), '-c', 'copy', 'output.mp4');
        
        const data = ffmpeg.FS('readFile', 'output.mp4');
        const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
        
        videoOutput.src = url;
        downloadLink.href = url;
        downloadLink.download = `cut_${start}-${end}.mp4`;
        downloadLink.style.display = "block";
        log("Valmis!");
    };
</script>
</body>
</html>
